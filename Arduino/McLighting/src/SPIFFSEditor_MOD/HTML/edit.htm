<!doctype html><html lang=sl><meta charset=UTF-8><meta content="width=device-width,initial-scale=1" name=viewport><title>ESP Upravitelj & Urejevalnik</title><style>:root{--bg-color:#1e1e1e;--sidebar-bg:#252526;--topbar-bg:#3c3c3c;--text-color:#cccccc;--accent-color:#007acc;--hover-bg:#2a2d2e;--editor-bg:#1e1e1e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg-color);color:var(--text-color);display:flex;flex-direction:column;height:100vh;overflow:hidden}#topbar{background:var(--topbar-bg);padding:10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #555;flex-wrap:wrap}input[type=file],input[type=text]{background:#333;color:#fff;border:1px solid #555;padding:6px 10px;border-radius:4px;flex:1;min-width:130px}button{background:var(--accent-color);color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:5px}button:hover{filter:brightness(1.2)}button:disabled{background:#555;cursor:not-allowed}#main-container{display:flex;flex:1;overflow:hidden;flex-direction:row}#sidebar{width:300px;background:var(--sidebar-bg);border-right:1px solid #333;padding:10px;display:flex;flex-direction:column;justify-content:space-between;flex-shrink:0}#file-box{overflow-y:auto;flex:1}.file-list{list-style:none}.file-item{display:flex;align-items:center;justify-content:space-between;border-radius:4px;cursor:pointer;margin-bottom:10px;gap:5px}.file-item:hover{background:var(--hover-bg)}.file-item.active{background:#094771}.file-name{display:flex;align-items:center;gap:6px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.file-actions{display:flex;gap:6px;flex-shrink:0}.btn-act{padding:6px 10px;font-size:14px;min-height:32px;min-width:36px;justify-content:center}.btn-download{background:#1e7e34}.btn-delete{background:#a12020}#storage-info{padding:10px 5px;border-top:1px solid #3c3c3c;font-size:12px}.progress-bar{background:#333;border-radius:4px;height:8px;width:100%;margin-top:5px;overflow:hidden}.progress-fill{background:var(--accent-color);height:100%;width:0%;transition:width .3s}#content-area{flex:1;display:flex;flex-direction:column;background:#111;position:relative;overflow:hidden}#editor-container{display:flex;flex-direction:column;width:100%;height:100%;padding:10px}#editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #333;flex-wrap:wrap;gap:8px}#code-editor{flex:1;background:var(--editor-bg);color:#d4d4d4;font-family:Consolas,'Courier New',monospace;font-size:14px;border:1px solid #3c3c3c;padding:10px;resize:none;outline:0;line-height:1.5}#preview-container{display:flex;justify-content:center;align-items:center;width:100%;height:100%;padding:20px;text-align:center;font-size:15px}#preview-img{max-width:90%;max-height:90%;object-fit:contain;box-shadow:0 4px 15px rgba(0,0,0,.5)}#loader{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:4px solid #f3f3f3;border-top:4px solid var(--accent-color);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;z-index:10}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@media (max-width:768px){body{overflow:auto}#main-container{flex-direction:column;height:auto;overflow:visible}#sidebar{width:100%;border-right:none;border-bottom:1px solid #333;height:auto;max-height:350px}#content-area{width:100%;height:60vh;min-height:400px}}</style><div id=topbar><button onclick=loadFiles()>🔄 Osveži seznam</button><input id=file-input type=file><button onclick=uploadFile()>📤 Naloži</button><input id=new-filename placeholder=nova_datoteka.txt><button onclick=createFile()>➕ Ustvari</button></div><div id=main-container><div id=sidebar><div id=file-box><ul class=file-list id=files></ul></div><div id=storage-info><div style=display:flex;justify-content:space-between><span>Disk:<span id=storage-used>0 B</span>/<span id=storage-total>0 B</span></span><strong id=storage-pct>0%</strong></div><div class=progress-bar><div id=progress-fill class=progress-fill></div></div></div></div><div id=content-area><div id=loader></div><div id=view-pane style=width:100%;height:100%><div id=preview-container>👉 Izberite datoteko za urejanje.</div></div></div></div><script>const API_URL="/edit",loader=document.getElementById("loader"),viewPane=document.getElementById("view-pane");let currentFilename="";function toggleLoader(e){loader.style.display=e?"block":"none"}async function updateStorageInfo(){try{const e=await fetch("/fs-status");if(e.ok){const t=await e.json(),n=0<t.total?Math.round(t.used/t.total*100):0;document.getElementById("storage-used").innerText=formatBytes(t.used),document.getElementById("storage-total").innerText=formatBytes(t.total),document.getElementById("storage-pct").innerText=n+"%",document.getElementById("progress-fill").style.width=n+"%"}}catch(e){console.error("Napaka stanja diska:",e)}}async function loadFiles(){toggleLoader(!0),updateStorageInfo();try{const e=await fetch(`${API_URL}?list=/`);if(!e.ok)throw new Error("Napaka pri branju podatkov.");const t=await e.json(),n=document.getElementById("files");n.innerHTML="",t.sort(((e,t)=>e.name.localeCompare(t.name))),t.forEach((e=>{if("file"===e.type){const t=document.createElement("li");t.className="file-item",e.name===currentFilename&&t.classList.add("active"),t.innerHTML=`<div class="file-name" onclick="selectFile('${e.name}', this)">📄 <span title="${e.name}">${e.name} (${formatBytes(e.size)})</span></div><div class="file-actions"><button class="btn-download" onclick="downloadFileDirect('${e.name}', event)">DL</button><button class="btn-delete" onclick="deleteFile('${e.name}', event)">Briši</button></div>`,n.appendChild(t)}}))}catch(e){alert(e.message)}finally{toggleLoader(!1)}}function downloadFileDirect(e,t){t.stopPropagation(),window.location.href=`${API_URL}?download=${e}`}async function selectFile(e,t){currentFilename=e,document.querySelectorAll(".file-item").forEach((e=>e.classList.remove("active"))),t&&t.parentElement.classList.add("active");const n=e.split(".").pop().toLowerCase();["txt","json","html","css","js","ini","conf","xml","h","cpp","ino"].includes(n)?await openInEditor(e):openInPreview(e,n)}async function openInEditor(e){toggleLoader(!0);try{const n=await fetch(`${API_URL}?edit=${e}&_ts=${Date.now()}`);if(!n.ok)throw new Error("Ni mogoče naložiti datoteke.");var t=await n.text();viewPane.innerHTML=`<div id="editor-container"><div id="editor-header"><strong>Urejanje: /${e} <span style="font-size:11px; opacity:0.6;">(Ctrl+S)</span></strong><button id="btn-save" onclick="saveFile('${e}')">💾 Shrani</button></div><textarea id="code-editor" spellcheck="false">${escapeHtml(t)}</textarea></div>`}catch(e){viewPane.innerHTML=`<div id="preview-container" style="color:#a12020;">⚠️ ${e.message}</div>`}finally{toggleLoader(!1)}}function openInPreview(e,t){var n=`${API_URL}?edit=${e}&_ts=${Date.now()}`;["png","jpg","jpeg","gif","bmp","ico","svg"].includes(t)?viewPane.innerHTML=`<div id="preview-container"><img id="preview-img" src="${n}" alt="${e}"></div>`:viewPane.innerHTML=`<div id="preview-container" style="text-align:center; flex-direction:column; gap:15px;"><p>Binarna datoteka (.${t})</p><a href="${API_URL}?download=${e}" style="color:var(--accent-color); font-weight:bold; text-decoration:none; font-size:18px;">⬇️ Prenesi</a></div>`}async function saveFile(e){const t=document.getElementById("btn-save");var n=document.getElementById("code-editor");if(n){t.disabled=!0,t.innerText="⏳ Shranjevanje...",toggleLoader(!0);const o=new FormData;var a=new Blob([n.value],{type:"text/plain"});o.append("data",a,"/"+e);try{(await fetch(API_URL,{method:"POST",body:o})).ok?(t.innerText="✅ Shranjeno!",setTimeout((()=>{const e=document.getElementById("btn-save");e&&(e.disabled=!1,e.innerText="💾 Shrani")}),1500),loadFiles()):(alert("Shranjevanje ni uspelo."),t.disabled=!1,t.innerText="💾 Shrani")}catch(e){alert(e.message),t.disabled=!1,t.innerText="💾 Shrani"}finally{toggleLoader(!1)}}}async function uploadFile(){const e=document.getElementById("file-input");if(0===e.files.length)return alert("Izberite datoteko!");toggleLoader(!0);const t=new FormData;t.append("data",e.files[0],"/"+e.files[0].name);try{(await fetch(API_URL,{method:"POST",body:t})).ok?(e.value="",loadFiles()):alert("Nalaganje ni uspelo.")}catch(e){alert(e.message)}finally{toggleLoader(!1)}}async function createFile(){const e=document.getElementById("new-filename");let t=e.value.trim();if(!t)return alert("Vnesite ime datoteke!");t.startsWith("/")||(t="/"+t),toggleLoader(!0);const n=new FormData;n.append("path",t);try{(await fetch(API_URL,{method:"PUT",body:n})).ok?(e.value="",currentFilename=t.substring(1),loadFiles(),setTimeout((()=>{document.querySelectorAll(".file-item").forEach((e=>{e.querySelector(".file-name span").innerText.startsWith(currentFilename)&&selectFile(currentFilename,e.querySelector(".file-name"))}))}),300)):alert("Ustvarjanje ni uspelo.")}catch(e){alert(e.message)}finally{toggleLoader(!1)}}async function deleteFile(e,t){if(t.stopPropagation(),confirm(`Ali res želite izbrisati ${e}?`)){toggleLoader(!0);const t=new FormData;t.append("path","/"+e);try{(await fetch(API_URL,{method:"DELETE",body:t})).ok?(currentFilename===e&&(currentFilename="",viewPane.innerHTML='<div id="preview-container">👉 Izberite datoteko na levi strani za urejanje ali predogled.</div>'),loadFiles()):alert("Brisanje ni uspelo.")}catch(e){alert(e.message)}finally{toggleLoader(!1)}}}function formatBytes(e){if(0===e)return"0 B";const t=Math.floor(Math.log(e)/Math.log(1024));return parseFloat((e/Math.pow(1024,t)).toFixed(1))+" "+["B","KB","MB"][t]}function escapeHtml(e){return e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}window.addEventListener("keydown",(function(e){if((e.ctrlKey||e.metaKey)&&"s"===e.key.toLo
