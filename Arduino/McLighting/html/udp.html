<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDP sync</title>
<style>
:root {
    --bg-main: #0d0e12;
    --bg-card: #161822;
    --bg-input: #212433;
    --text-main: #e2e8f0;
    --text-muted: #8a94a6;
    --accent-glow: #00ffca;
    --border-radius: 16px;
    --nav-bg: #a9a9a9;
    --success: #39ff14;
    --danger: #ff3131;
    --btn-link-bg: #555555;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1e222b;
    color: #f5f5f5;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px
}

.cw {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 20px
}

.status-panel
 {flex-wrap: wrap;
    background: #282c34;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    border: 1px solid #3e4451;
    display: flex;
    border-left: 5px solid #98c379;
    gap: 10px
}

.status-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #3e4451;
    padding-bottom: 8px;
    font-size: 15px
}
.status {
    padding: 4px 10px;
    background: var(--bg-input);
    border-radius: 8px;
    color: var(--text-muted);
}
.status-label {
    color: #abb2bf
}
.status-value {
    font-weight: 700;
    color: #fff
}
#device-name {
    color: var(--accent-glow);
    font-weight: bold;
}

.ff{flex-basis: 100%;}
.fh{flex-basis: calc(50% - 5px);}

/* Novi stili za razdelitev skupin */
.group-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin: 12px 0 6px 2px;
    font-weight: bold;
}

.device-item {
    padding: 10px;
    background: #212433;
    margin-bottom: 6px;
    border-radius: 8px;
    border: 1px solid #2d3142;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.device-item.match {
    border-left: 4px solid var(--success);
    background: #1c2e24;
}

</style>
</head>
<body>

<div class="cw">

  <div class="status-panel">
    <a href="/" class="status ff"><span class="status-label">Ime: </span><span class="status-value" id="device-name">...</span></a>
    <div class="status fh"><span class="status-label">Tip: </span><span class="status-value" id="device-type">...</span></div>
    <div class="status fh"><span class="status-label">Podtip: </span><span class="status-value" id="device-subtype">...</span></div>
  </div>

  <div id="udpModal" class="modal" >
    <div class="modal-content" style="background-color:#282c34; color:#e2e8f0; padding:20px; border-left: 5px solid #ddb65b; border-radius:16px; text-align:center; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
      <h3 style="color:#ff9800; margin-bottom:15px; font-family:sans-serif;">UDP Sync</h3>
      
      <div style="margin:4px 0; text-align:left; font-family:sans-serif; display:flex; justify-content: space-around; flex-wrap: wrap; gap: 10px;">
        <label style="font-size:16px; display:flex; align-items:center; cursor:pointer;">
          <input type="radio" name="udp_mode" id="radStandalone" value="standalone" onchange="updateUdpStatus()" style="transform:scale(1.3); margin-right:6px;"> Standalone
        </label>
        <label style="font-size:16px; display:flex; align-items:center; cursor:pointer;">
          <input type="radio" name="udp_mode" id="radMaster" value="master" onchange="updateUdpStatus()" style="transform:scale(1.3); margin-right:6px;"> Master
        </label>
        <label style="font-size:16px; display:flex; align-items:center; cursor:pointer;">
          <input type="radio" name="udp_mode" id="radSlave" value="slave" onchange="updateUdpStatus()" style="transform:scale(1.3); margin-right:6px;"> Receiver
        </label>
      </div>
      
      <button onclick="startDiscovery()" style="background-color:#39ff14; color:#0d0e12; border:none; padding:12px 20px; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:15px; width:100%;">Išči naprave v omrežju</button>
      <div id="deviceList" style="margin-top:15px; text-align:left; color:#e2e8f0; font-family:sans-serif; max-height:220px; overflow-y:auto;"></div>
      
      <p style="font-size:12px; color:#8a94a6; margin-top:20px; font-family:sans-serif;">Moduli z enakim tipom se bodo samodejno sinhronizirali v skupini.</p>
    </div>
  </div>
</div>

<script>
function set_masterSlave() {
  fetch('/udp/get')
    .then(response => response.json())
    .then(data => {
      if (data.mode === 'master') {
        document.getElementById('radMaster').checked = true;
      } else if (data.mode === 'slave' || data.mode === 'receiver') {
        document.getElementById('radSlave').checked = true;
      } else {
        document.getElementById('radStandalone').checked = true;
      }
    })
    .catch(err => console.error("Napaka pri branju UDP:", err));
}


function updateUdpStatus() {
  const isMaster = document.getElementById('radMaster').checked;
  const isSlave = document.getElementById('radSlave').checked;
  
  const urlParams = new URLSearchParams();
  urlParams.append('master', isMaster ? "1" : "0");
  urlParams.append('slave', isSlave ? "1" : "0");

  fetch('/udp/set', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: urlParams.toString()
  })
  .then(response => {
    if (!response.ok) console.warn("ESP vrnil napako:", response.status);
  })
  .catch(err => console.error("Napaka pri povezavi:", err));
}

function startDiscovery() {
  const listDiv = document.getElementById('deviceList');
  listDiv.innerHTML = "<p style='color:#8a94a6; text-align:center;'>Iščem...</p>";

  fetch('/udp/discover')
    .then(() => {
      setTimeout(fetchDeviceList, 1200);
    });
}

function fetchDeviceInfo() {
  fetch('/esp/info')
    .then(response => response.json())
    .then(data => {
      document.getElementById('device-name').textContent = data.info.name;
      document.getElementById('device-type').textContent = data.info.modul;
      document.getElementById('device-subtype').textContent = data.info.sub_modul;
    })
    .catch(err => console.error("Napaka pri branju Info:", err));
}

function fetchDeviceList() {
  fetch('/udp/list')
    .then(response => response.json())
    .then(devices => {
      const listDiv = document.getElementById('deviceList');
      if (devices.length === 0) {
        listDiv.innerHTML = "<p style='color:#ff9800; text-align:center;'>Ni najdenih naprav.</p>";
        return;
      }

      const localType = document.getElementById('device-type').textContent;
      const localSubtype = document.getElementById('device-subtype').textContent;
      const targetMatchString = `${localType}|${localSubtype}`;

      let exactMatches = "";
      let otherDevices = "";
      let matchCount = 0;
      let otherCount = 0;

      devices.forEach(device => {
        let badgeColor = "#8a94a6";
        let badgeText = "Standalone";
        
        if (device.mode === "master") {
          badgeColor = "#ff9800";
          badgeText = "MASTER";
        } else if (device.mode === "slave") {
          badgeColor = "#00ffca";
          badgeText = "RECEIVER";
        }

        const badgeHtml = `<span style="font-size:10px; font-weight:bold; padding:2px 6px; background:${badgeColor}; color:#0d0e12; border-radius:4px; margin-left:8px; text-transform:uppercase;">${badgeText}</span>`;

        const itemHtml = `
          <div class="device-item ${device.type === targetMatchString ? 'match' : ''}">
            <span>🌐 <b>IP:</b> <a href="http://${device.ip}" target="_blank" style="color:#00ffca; text-decoration:none; font-weight:bold;">${device.ip}</a> ${badgeHtml}</span>
            <span style="color:#8a94a6;">[${device.type}]</span>
          </div>`;

        if (device.type === targetMatchString) {
          exactMatches += itemHtml;
          matchCount++;
        } else {
          otherDevices += itemHtml;
          otherCount++;
        }
      });

      let finalHtml = "";

      if (matchCount > 0) {
        finalHtml += `<div class="group-title" style="color:var(--success);">🟢 Sinhronizirana skupina (${matchCount})</div>`;
        finalHtml += exactMatches;
      }

      if (otherCount > 0) {
        finalHtml += `<div class="group-title">⚪ Ostale naprave v omrežju (${otherCount})</div>`;
        finalHtml += otherDevices;
      }

      listDiv.innerHTML = finalHtml;
    })
    .catch(err => console.error("Napaka pri branju seznama:", err));
}


document.addEventListener("DOMContentLoaded", () => {
  fetchDeviceInfo();
  set_masterSlave();
});
</script>
</body>
</html>
